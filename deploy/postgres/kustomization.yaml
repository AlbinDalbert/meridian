# A single Postgres (with pgvector) for Meridian. Optional: leave it out of your overlay if
# you already run Postgres. Expects a Secret `meridian-postgres` with `POSTGRES_PASSWORD`.
# See ../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml
